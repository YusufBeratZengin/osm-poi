[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-poi"
version = "0.1.0"
description = "Export points of interest from OpenStreetMap (Overpass API) to CSV, GeoJSON or JSONL with category presets, polite rate limiting and caching."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Berat Zengin" }]
keywords = [
    "poi",
    "geocoding",
    "leads",
    "odbl",
    "local-business",
    "openstreetmap",
    "overpass",
    "nominatim",
    "csv",
    "geojson",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/osm-poi"
Source = "https://github.com/YusufBeratZengin/osm-poi"
Issues = "https://github.com/YusufBeratZengin/osm-poi/issues"
Changelog = "https://github.com/YusufBeratZengin/osm-poi/blob/main/CHANGELOG.md"

[project.scripts]
osm-poi = "osm_poi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osm_poi = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=osm_poi --cov-report=term-missing"

[tool.coverage.run]
source = ["src/osm_poi"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
