[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-poi"
version = "0.1.0"
description = "Export points of interest from OpenStreetMap (Overpass API) to CSV, GeoJSON or JSONL with category presets, polite rate limiting and caching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yusuf Berat Zengin" }]
keywords = ["openstreetmap", "overpass", "poi", "nominatim", "csv", "geojson"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/osm-poi"
Issues = "https://github.com/YusufBeratZengin/osm-poi/issues"
Changelog = "https://github.com/YusufBeratZengin/osm-poi/blob/main/CHANGELOG.md"

[project.scripts]
osm-poi = "osm_poi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osm_poi = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
