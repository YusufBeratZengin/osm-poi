name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src
      - name: Test with coverage
        run: python -m pytest -q --cov=osm_poi --cov-report=term-missing

  package:
    name: Build, check and smoke test wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Verify wheel contents
        run: |
          python -c "import zipfile, glob
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any('osm_poi/data/presets.json' in n for n in names), 'presets.json missing'
          assert any('osm_poi/py.typed' in n for n in names), 'py.typed missing'
          print('Wheel archive contents verified.')"
      - name: Smoke test outside source tree
        run: |
          mkdir -p /tmp/smoke
          WHEEL=$(pwd)/$(ls dist/*.whl | head -n 1)
          cd /tmp/smoke
          python -m venv .venv
          source .venv/bin/activate
          pip install "$WHEEL"
          osm-poi --version
          osm-poi presets | head
          osm-poi fetch --bbox 40.95,29.00,41.03,29.11 -c cafe --dry-run --user-agent "smoke-test/1.0"
